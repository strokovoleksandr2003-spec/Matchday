<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Таблиця — Matchday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .table-wrap { overflow-x: auto; }
  table.data td.form-cell { padding-right: 0; }
  table.data td.form-cell .badges { justify-content: flex-end; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted); margin-top: 14px; flex-wrap: wrap; }
</style>
</head>
<body>

<div id="header"></div>

<main class="shell">

  <h1 class="page-title">Турнірна таблиця</h1>
  <p class="page-sub">Українська Прем'єр-ліга</p>

  <div class="card">
    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr>
            <th>#</th><th>Команда</th>
            <th>І</th><th>В</th><th>Н</th><th>П</th>
            <th>ЗМ</th><th>ПМ</th><th>РМ</th><th>О</th>
            <th style="text-align:right">Форма</th>
          </tr>
        </thead>
        <tbody id="standingsBody">
          <tr><td colspan="11" class="empty">Завантаження…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="legend">
      <span>І — ігри</span><span>В — виграші</span><span>Н — нічиї</span><span>П — поразки</span>
      <span>ЗМ — забиті</span><span>ПМ — пропущені</span><span>РМ — різниця</span><span>О — очки</span>
    </div>
  </div>

</main>

<script src="assets/app.js"></script>
<script>
function render(standings, form) {
  const body = document.getElementById('standingsBody');
  if (!standings.length) {
    body.innerHTML = '<tr><td colspan="11" class="empty">Команд ще немає.</td></tr>';
    return;
  }

  body.innerHTML = standings.map(row => {
    const teamForm = form[row.team.name] || [];
    const gd = row.goal_difference;
    return `
      <tr>
        <td>${row.position}</td>
        <td><a href="team.html?id=${row.team.id}">${row.team.name}</a></td>
        <td>${row.matches_played}</td>
        <td>${row.wins}</td>
        <td>${row.draws}</td>
        <td>${row.losses}</td>
        <td>${row.goals_for}</td>
        <td>${row.goals_against}</td>
        <td>${gd > 0 ? '+' : ''}${gd}</td>
        <td style="font-weight:700">${row.points}</td>
        <td class="form-cell">
          <span class="badges">
            ${teamForm.map(r => `<span class="badge ${r}">${r}</span>`).join('')}
          </span>
        </td>
      </tr>`;
  }).join('');
}

async function load() {
  try {
    const [standingsRes, formRes] = await Promise.all([
      api('/standings'),
      api('/form?limit=5'),
    ]);
    render(standingsRes.standings, formRes.form);
  } catch (err) {
    document.getElementById('standingsBody').innerHTML =
      `<tr><td colspan="11" class="error">${err.message}</td></tr>`;
  }
}

load();
</script>
</body>
</html>
