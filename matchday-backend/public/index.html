<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matchday — УПЛ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .next-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .next-meta .tag {
    font-size: 11px; color: var(--accent); background: rgba(30,122,76,0.22);
    padding: 3px 9px; border-radius: 6px; font-weight: 600;
  }
  .next-meta .when { font-size: 12px; color: #9A9D93; }
  .next-teams { display: flex; align-items: center; justify-content: space-between; }
  .next-team { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 110px; }
  .next-team span:last-child { font-size: 13px; font-weight: 600; text-align: center; }
  .next-vs { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: #9A9D93; }

  .result-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px;
  }
  .result-row:first-child { border-top: none; }
  .result-row .score { font-weight: 700; }

  .see-all { display: block; text-align: center; font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 12px; }
</style>
</head>
<body>

<div id="header"></div>

<main class="shell">

  <h1 class="page-title">Українська Прем'єр-ліга</h1>
  <p class="page-sub" id="updated">завантаження…</p>

  <div class="card-dark" id="nextMatch">
    <p class="empty" style="color:#9A9D93">Завантаження…</p>
  </div>

  <h2>Турнірна таблиця</h2>
  <div class="card">
    <table class="data">
      <thead><tr><th>#</th><th>Команда</th><th>І</th><th>О</th></tr></thead>
      <tbody id="standingsBody"><tr><td colspan="4" class="empty">Завантаження…</td></tr></tbody>
    </table>
    <a class="see-all" href="table.html">Повна таблиця →</a>
  </div>

  <h2>Останні результати</h2>
  <div class="card" id="recentResults"><p class="empty">Завантаження…</p></div>

</main>

<script src="assets/app.js"></script>
<script>
function renderNextMatch(match) {
  const el = document.getElementById('nextMatch');
  if (!match) {
    el.innerHTML = '<p class="empty" style="color:#9A9D93">Запланованих матчів немає.</p>';
    return;
  }
  el.innerHTML = `
    <div class="next-meta">
      <span class="tag">${match.matchday ? 'ТУР ' + match.matchday : 'НАЙБЛИЖЧИЙ МАТЧ'}</span>
      <span class="when">${fmtDateTime(match.utc_date)}</span>
    </div>
    <div class="next-teams">
      <div class="next-team">
        <div class="team-avatar">${initials(match.home_team.name)}</div>
        <span>${match.home_team.name}</span>
      </div>
      <span class="next-vs">VS</span>
      <div class="next-team">
        <div class="team-avatar">${initials(match.away_team.name)}</div>
        <span>${match.away_team.name}</span>
      </div>
    </div>`;
}

function renderStandingsPreview(standings) {
  const body = document.getElementById('standingsBody');
  if (!standings.length) {
    body.innerHTML = '<tr><td colspan="4" class="empty">Команд ще немає.</td></tr>';
    return;
  }
  body.innerHTML = standings.slice(0, 5).map(row => `
    <tr>
      <td>${row.position}</td>
      <td><a href="team.html?id=${row.team.id}">${row.team.name}</a></td>
      <td>${row.matches_played}</td>
      <td style="font-weight:700">${row.points}</td>
    </tr>`).join('');
}

function renderRecentResults(matches) {
  const el = document.getElementById('recentResults');
  const finished = matches
    .filter(m => m.status === 'finished')
    .sort((a, b) => new Date(b.utc_date) - new Date(a.utc_date))
    .slice(0, 5);

  if (!finished.length) {
    el.innerHTML = '<p class="empty">Завершених матчів ще немає.</p>';
    return;
  }

  el.innerHTML = finished.map(m => `
    <div class="result-row">
      <span>${m.home_team.name}</span>
      <span class="score">${m.score.home} : ${m.score.away}</span>
      <span>${m.away_team.name}</span>
    </div>`).join('') + '<a class="see-all" href="matches.html">Усі матчі →</a>';
}

async function load() {
  try {
    const [standingsRes, nextRes, matchesRes] = await Promise.all([
      api('/standings'),
      api('/next-match'),
      api('/matches'),
    ]);

    renderNextMatch(nextRes.match);
    renderStandingsPreview(standingsRes.standings);
    renderRecentResults(matchesRes.matches);

    document.getElementById('updated').textContent =
      'оновлено ' + new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    document.getElementById('updated').innerHTML = `<span class="error">${err.message}</span>`;
  }
}

load();
</script>
</body>
</html>
